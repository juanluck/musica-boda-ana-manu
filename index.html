<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f3ea">
  <meta name="description" content="Programa musical de la ceremonia de boda de Ana Belén y Manuel, 12 de septiembre de 2026, Algarinejo.">
  <title>Ana Belén & Manuel · Música de la ceremonia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="mosaic-strip mosaic-strip--top" aria-hidden="true"></div>

  <header class="hero">
    <span class="botanical botanical--left" aria-hidden="true"></span>
    <span class="botanical botanical--right" aria-hidden="true"></span>

    <div class="monogram" aria-label="Anagrama AM">
      <img src="assets/anagrama-am.png" alt="Anagrama de Ana Belén y Manuel">
    </div>
    <p class="eyebrow">Música de la ceremonia</p>
    <h1 id="couple"></h1>
    <div class="gold-rule" aria-hidden="true"><span>✦</span></div>
    <p class="ceremony-line"><span id="date"></span> · <span id="time"></span> h</p>
    <p class="ceremony-place"><span id="church"></span><br><span id="place"></span></p>
    <a class="quartet-link" id="quartet" target="_blank" rel="noopener noreferrer"></a>
  </header>

  <main>
    <section class="intro" aria-labelledby="repertorio-title">
      <p class="eyebrow">Un recorrido por la liturgia</p>
      <h2 id="repertorio-title">El repertorio</h2>
      <p>Cada pieza acompaña un momento concreto de la ceremonia. Puedes volver a escucharlas aquí, en el mismo orden en el que sonarán ese día.</p>
    </section>

    <section class="timeline" id="timeline" aria-label="Programa musical"></section>
  </main>

  <footer>
    <div class="footer-ornament" aria-hidden="true"></div>
    <p class="footer-couple">Ana Belén & Manuel</p>
    <p>12 · 09 · 2026 · Algarinejo</p>
    <p class="footer-quartet">Interpretación musical · <a id="footerQuartet" target="_blank" rel="noopener noreferrer"></a></p>
  </footer>

  <div class="mosaic-strip mosaic-strip--bottom" aria-hidden="true"></div>

  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
